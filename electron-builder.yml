appId: com.noctisai.app
productName: Noctisai
directories:
  output: dist
  buildResources: build
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  requestedExecutionLevel: requireAdministrator
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  category: Utility
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
files:
  - src/**/*
  - assets/**/*
  - package.json
  - node_modules/**/*
  - native/build/Release/*.node
  - "!**/*.{md,ts,map}"
  - "!native/src/**/*"
  - "!native/binding.gyp"
publish:
  provider: github
  owner: IsmailofficialGithub
  repo: interview-cracker

